name: Build MapleAlert V1.0 Permanent
on:
  push:
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.11,<7"
      - name: Test reminders and Windows UI
        run: python -m unittest discover -v
      - name: Build Windows program with application icon
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MapleAlert-1.0-Permanent --icon assets/app-icon.ico --add-data "assets;assets" --add-data "COPYRIGHT.txt;." --collect-all windows_toasts --collect-all winrt app.py
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/MapleAlert-1.0-Permanent.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content "$env:TEMP/MapleAlert-build-error.txt" -ErrorAction SilentlyContinue
            throw "Packaged app self-test failed"
          }
      - name: Include copyright and third-party licenses
        shell: python {0}
        run: |
          from pathlib import Path
          import importlib.metadata as metadata
          import shutil
          shutil.copyfile('COPYRIGHT.txt', 'dist/COPYRIGHT.txt')
          shutil.copyfile('RECORDING_README.txt', 'dist/RECORDING_README.txt')
          root = Path('dist/THIRD_PARTY_LICENSES')
          root.mkdir(exist_ok=True)
          for distribution in metadata.distributions():
              name = distribution.metadata.get('Name', 'unknown')
              for entry in distribution.files or []:
                  filename = Path(str(entry)).name.lower()
                  if filename.startswith(('license', 'licence', 'copying', 'notice')):
                      source = Path(distribution.locate_file(entry))
                      if source.is_file():
                          target = root / name / Path(str(entry)).name
                          target.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copyfile(source, target)
      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: MapleAlert-1.0-Permanent-Windows-x64
          path: |
            dist/MapleAlert-1.0-Permanent.exe
            dist/COPYRIGHT.txt
            dist/RECORDING_README.txt
            dist/THIRD_PARTY_LICENSES/
          if-no-files-found: error
