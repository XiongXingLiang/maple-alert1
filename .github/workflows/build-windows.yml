name: Build Windows desktop app
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.11,<7"
      - name: Test alarm logic
        run: python -m unittest discover -v
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MapleAlert --add-data "assets;assets" --collect-all windows_toasts --collect-all winrt app.py
      - name: Smoke test frozen app
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/MapleAlert.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content "$env:TEMP/MapleAlert-build-error.txt" -ErrorAction SilentlyContinue
            throw "Frozen app self-test failed"
          }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MapleAlert-Windows-x64
          path: dist/MapleAlert.exe
          if-no-files-found: error
